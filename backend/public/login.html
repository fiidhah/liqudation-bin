<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - SmartBin</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom Style -->
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">

    <!-- TOP ANNOUNCEMENT TICKER -->
    <div class="top-announcement-bar">
        <span>⚡ <strong>SMARTBIN LIQUIDATION:</strong> DAILY PRICE DROP SCHEDULE ACTIVE • RESTOCKED FRIDAY • CLEARANCE THURSDAY</span>
    </div>

    <!-- CLEAN EDITORIAL NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-editorial-clean sticky-top">
        <div class="container-fluid px-lg-5">
            <a class="brand-logo-text" href="/index.html">
                <div class="logo-icon-wrap">
                    <i class="bi bi-box-seam-fill"></i>
                </div>
                <span>SmartBin</span>
            </a>

            <div class="ms-auto">
                <a href="/index.html" class="btn btn-outline-dark btn-sm rounded-pill px-3 fw-bold">
                    <i class="bi bi-arrow-left me-1"></i> Back to Store
                </a>
            </div>
        </div>
    </nav>

    <main class="container my-5 d-flex align-items-center justify-content-center" style="min-height: 70vh;">
        <div class="card border-0 shadow-lg rounded-4 overflow-hidden w-100 bg-white" style="max-width: 480px;">
            <div class="card-header text-white text-center py-4" style="background: #111111;">
                <div class="d-inline-flex p-3 rounded-circle bg-white bg-opacity-10 mb-2">
                    <i class="bi bi-person-lock text-warning fs-2"></i>
                </div>
                <h4 class="fw-bold mb-0 text-white">Sign In to SmartBin</h4>
                <p class="text-white-50 small mb-0">Select your account role and enter credentials</p>
            </div>

            <div class="card-body p-4 p-md-5">
                <!-- Role Switcher Tabs -->
                <ul class="nav nav-pills nav-fill mb-4 p-1 bg-light rounded-pill" id="loginRoleTabs">
                    <li class="nav-item">
                        <button class="nav-link active rounded-pill btn-sm fw-bold" data-role="User">Customer</button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link rounded-pill btn-sm fw-bold" data-role="Manager">Manager</button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link rounded-pill btn-sm fw-bold" data-role="Admin">Admin</button>
                    </li>
                </ul>

                <form id="loginForm">
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-muted text-uppercase">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-0"><i class="bi bi-envelope text-muted"></i></span>
                            <input type="email" class="form-control rounded-end-3 py-2 bg-light border-0" id="loginEmail" placeholder="name@gmail.com" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label small fw-bold text-muted text-uppercase">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-0"><i class="bi bi-key text-muted"></i></span>
                            <input type="password" class="form-control rounded-end-3 py-2 bg-light border-0" id="loginPassword" placeholder="••••••••" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-dark btn-lg w-100 rounded-pill fw-bold mb-3 text-white shadow-sm" id="loginSubmitBtn">
                        Sign In Now <i class="bi bi-arrow-right ms-1 text-warning"></i>
                    </button>
                </form>

                <!-- Quick Test Login Helpers -->
                <div class="p-3 bg-light rounded-3 text-center mb-3">
                    <div class="small fw-bold text-muted text-uppercase mb-2">⚡ Quick 1-Click Credentials:</div>
                    <div class="d-flex flex-wrap gap-1 justify-content-center">
                        <button class="btn btn-outline-dark btn-sm rounded-pill" onclick="fillCredentials('fidha@gmail.com', '123456', 'User')">
                            Customer
                        </button>
                        <button class="btn btn-outline-primary btn-sm rounded-pill" onclick="fillCredentials('manager@gmail.com', '123456', 'Manager')">
                            Manager
                        </button>
                        <button class="btn btn-outline-danger btn-sm rounded-pill" onclick="fillCredentials('admin@gmail.com', 'admin123', 'Admin')">
                            Admin
                        </button>
                    </div>
                </div>

                <div class="text-center small text-muted">
                    Don't have an account? <a href="/register.html" class="fw-bold text-dark text-decoration-underline">Register as Customer</a>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        let selectedRole = "User";

        document.querySelectorAll("#loginRoleTabs button").forEach(btn => {
            btn.addEventListener("click", () => {
                document.querySelectorAll("#loginRoleTabs button").forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                selectedRole = btn.dataset.role;
            });
        });

        function fillCredentials(email, pass, role) {
            document.getElementById("loginEmail").value = email;
            document.getElementById("loginPassword").value = pass;
            selectedRole = role;
            document.querySelectorAll("#loginRoleTabs button").forEach(b => {
                if (b.dataset.role === role) b.classList.add("active");
                else b.classList.remove("active");
            });
        }

        document.getElementById("loginForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const email = document.getElementById("loginEmail").value.trim();
            const password = document.getElementById("loginPassword").value;
            const submitBtn = document.getElementById("loginSubmitBtn");

            submitBtn.disabled = true;
            submitBtn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>Signing in...`;

            let endpoint = "/users/login";
            if (selectedRole === "Admin") endpoint = "/admin/login";
            else if (selectedRole === "Manager") endpoint = "/managers/login";

            try {
                const res = await API.post(endpoint, { email, password });
                if (res.success) {
                    const userObj = res.user || res.manager || res.admin;
                    Auth.setSession(res.token, userObj, selectedRole);

                    const redirectUser = () => {
                        if (selectedRole === "Admin") {
                            window.location.href = "/admin/index.html";
                        } else if (selectedRole === "Manager") {
                            window.location.href = "/manager/index.html";
                        } else {
                            const urlParams = new URLSearchParams(window.location.search);
                            window.location.href = urlParams.get("redirect") || "/index.html";
                        }
                    };

                    // Standard Login Modal Method (Std Method)
                    API.showLoginSuccess({
                        user: userObj,
                        role: selectedRole,
                        onContinue: redirectUser
                    });
                }
            } catch (err) {
                API.showErrorModal("Sign In Failed", err.message || "Invalid email or password. Please verify your credentials.");
                submitBtn.disabled = false;
                submitBtn.innerHTML = `Sign In Now <i class="bi bi-arrow-right ms-1 text-warning"></i>`;
            }
        });
    </script>
</body>
</html>
