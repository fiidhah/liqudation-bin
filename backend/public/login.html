<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SmartBin Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
        <div class="container">
            <a class="navbar-brand" href="/index.html">
                <i class="bi bi-box2-heart-fill text-warning fs-3"></i>
                <span>SmartBin</span>
                <span class="brand-badge">Authentication</span>
            </a>
            <a href="/index.html" class="btn btn-outline-light btn-sm rounded-pill px-3">
                <i class="bi bi-arrow-left me-1"></i> Back to Store
            </a>
        </div>
    </nav>

    <main class="container my-5 d-flex align-items-center justify-content-center" style="min-height: 70vh;">
        <div class="card border-0 shadow-lg rounded-4 overflow-hidden w-100" style="max-width: 480px;">
            <div class="card-header bg-dark text-white text-center py-4">
                <i class="bi bi-person-lock display-4 text-warning mb-2 d-block"></i>
                <h4 class="fw-bold mb-0">Sign In to SmartBin</h4>
                <p class="text-white-50 small mb-0">Access customer orders, manage inventory, or admin dashboard</p>
            </div>

            <div class="card-body p-4 p-md-5 bg-white">
                <!-- Role Switcher Tabs -->
                <ul class="nav nav-pills nav-fill mb-4 p-1 bg-light rounded-pill" id="loginRoleTabs">
                    <li class="nav-item">
                        <button class="nav-link active rounded-pill btn-sm fw-bold" data-role="User">Customer</button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link rounded-pill btn-sm fw-bold" data-role="Manager">Manager</button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link rounded-pill btn-sm fw-bold" data-role="Admin">Admin</button>
                    </li>
                </ul>

                <form id="loginForm">
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-muted text-uppercase">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control rounded-end-3 py-2" id="loginEmail" placeholder="name@example.com" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label small fw-bold text-muted text-uppercase">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-key"></i></span>
                            <input type="password" class="form-control rounded-end-3 py-2" id="loginPassword" placeholder="••••••••" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary-custom btn-lg w-100 rounded-pill fw-bold mb-3" id="loginSubmitBtn">
                        Sign In Now
                    </button>
                </form>

                <!-- Quick Demo Login Helpers -->
                <div class="p-3 bg-light rounded-3 text-center mb-3">
                    <div class="small fw-bold text-muted text-uppercase mb-2">⚡ Quick Test Logins:</div>
                    <div class="d-flex flex-wrap gap-1 justify-content-center">
                        <button class="btn btn-outline-dark btn-sm rounded-pill" onclick="fillCredentials('customer@smartbin.com', 'user123', 'User')">
                            Customer
                        </button>
                        <button class="btn btn-outline-primary btn-sm rounded-pill" onclick="fillCredentials('manager@smartbin.com', 'manager123', 'Manager')">
                            Manager
                        </button>
                        <button class="btn btn-outline-danger btn-sm rounded-pill" onclick="fillCredentials('admin@smartbin.com', 'admin123', 'Admin')">
                            Admin
                        </button>
                    </div>
                </div>

                <div class="text-center small text-muted">
                    Don't have an account? <a href="/register.html" class="fw-bold text-danger">Register as Customer</a>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        let selectedRole = "User";

        document.querySelectorAll("#loginRoleTabs button").forEach(btn => {
            btn.addEventListener("click", () => {
                document.querySelectorAll("#loginRoleTabs button").forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                selectedRole = btn.dataset.role;
            });
        });

        function fillCredentials(email, pass, role) {
            document.getElementById("loginEmail").value = email;
            document.getElementById("loginPassword").value = pass;
            selectedRole = role;
            document.querySelectorAll("#loginRoleTabs button").forEach(b => {
                if (b.dataset.role === role) b.classList.add("active");
                else b.classList.remove("active");
            });
        }

        document.getElementById("loginForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const email = document.getElementById("loginEmail").value.trim();
            const password = document.getElementById("loginPassword").value;
            const submitBtn = document.getElementById("loginSubmitBtn");

            submitBtn.disabled = true;
            submitBtn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>Signing in...`;

            let endpoint = "/users/login";
            if (selectedRole === "Admin") endpoint = "/admin/login";
            else if (selectedRole === "Manager") endpoint = "/managers/login";

            try {
                const res = await API.post(endpoint, { email, password });
                if (res.success) {
                    const userObj = res.user || res.manager || res.admin;
                    Auth.setSession(res.token, userObj, selectedRole);
                    API.showToast("Welcome back! " + (userObj.full_name || ""), "success");

                    setTimeout(() => {
                        if (selectedRole === "Admin") {
                            window.location.href = "/admin/index.html";
                        } else if (selectedRole === "Manager") {
                            window.location.href = "/manager/index.html";
                        } else {
                            const urlParams = new URLSearchParams(window.location.search);
                            window.location.href = urlParams.get("redirect") || "/index.html";
                        }
                    }, 1000);
                }
            } catch (err) {
                API.showToast(err.message || "Invalid credentials.", "error");
                submitBtn.disabled = false;
                submitBtn.innerHTML = `Sign In Now`;
            }
        });
    </script>
</body>
</html>
