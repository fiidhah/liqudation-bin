        <!-- Data Store 4 -->
        <line x1="688" y1="430" x2="850" y2="430" stroke="#000000" stroke-width="1.8"/>
        <line x1="688" y1="480" x2="850" y2="480" stroke="#000000" stroke-width="1.8"/>
        <line x1="688" y1="430" x2="688" y2="480" stroke="#000000" stroke-width="1.8"/>
        <line x1="703" y1="430" x2="703" y2="480" stroke="#000000" stroke-width="1.8"/>
        <text x="776" y="460" text-anchor="middle" font-size="13" font-family="Arial, sans-serif" fill="#000">Price Schedule</text>
        
        <!-- Process 5 -->
        <line x1="340" y1="570" x2="386" y2="570" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
        <ellipse cx="490" cy="570" rx="102" ry="36" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
        <text x="490" y="566" text-anchor="middle" font-size="13" font-family="Arial, sans-serif" fill="#000">Manage Offers</text>
               <text x="490" y="584" text-anchor="middle" font-size="13" font-family="Arial, sans-serif" fill="#000">&amp; Lucky Draws</text>
        
        <!-- Arrow to Data Store -->
        <line x1="594" y1="570" x2="684" y2="570" stroke="#000000" stroke-width="1.5" marker-start="url(#arrow-start)" marker-end="url(#arrow)"/>
        
        <!-- Data Store 5 -->
        <line x1="688" y1="545" x2="850" y2="545" stroke="#000000" stroke-width="1.8"/>
        <line x1="688" y1="595" x2="850" y2="595" stroke="#000000" stroke-width="1.8"/>
        <line x1="688" y1="545" x2="688" y2="595" stroke="#000000" stroke-width="1.8"/>
        <line x1="703" y1="545" x2="703" y2="595" stroke="#000000" stroke-width="1.8"/>
        <text x="776" y="575" text-anchor="middle" font-size="13" font-family="Arial, sans-serif" fill="#000">Offers &amp; Draws</text>
        
</svg>