<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" style="background: #ffffff;">
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
        </marker>
        <marker id="arrow-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 8 1.5 L 0 5 L 8 8.5 z" fill="#000000"/>
        </marker>
    </defs>

    <!-- Top Heading -->
    <text x="450" y="42" text-anchor="middle" font-size="17" font-weight="bold" font-family="Arial, sans-serif" letter-spacing="0.5" fill="#000">DATA FLOW DIAGRAM (DFD) - LEVEL 1 ADMIN</text>
    <line x1="230" y1="52" x2="670" y2="52" stroke="#000000" stroke-width="2"/>

    <!-- Login Table (Top Left Data Store) -->
    <line x1="195" y1="85" x2="315" y2="85" stroke="#000000" stroke-width="1.8"/>
    <line x1="195" y1="135" x2="315" y2="135" stroke="#000000" stroke-width="1.8"/>
    <line x1="195" y1="85" x2="195" y2="135" stroke="#000000" stroke-width="1.8"/>
    <line x1="210" y1="85" x2="210" y2="135" stroke="#000000" stroke-width="1.8"/>
    <text x="262" y="114" text-anchor="middle" font-size="13" font-family="Arial, sans-serif" fill="#000">Admin Table</text>

    <!-- Entity (Left Box) -->
    <rect x="50" y="310" width="110" height="60" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    <text x="105" y="346" text-anchor="middle" font-size="16" font-weight="bold" font-family="Arial, sans-serif" fill="#000">Admin</text>

    <!-- Arrow Entity to Login -->
    <line x1="160" y1="340" x2="216" y2="340" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Login Process (Circle) -->
    <ellipse cx="255" cy="340" rx="36" ry="36" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
    <text x="255" y="345" text-anchor="middle" font-size="14" font-family="Arial, sans-serif" fill="#000">Login</text>

    <!-- Double-headed arrow between Login and Login Table -->
    <line x1="255" y1="302" x2="255" y2="139" stroke="#000000" stroke-width="1.5" marker-start="url(#arrow-start)" marker-end="url(#arrow)"/>

    <!-- Horizontal connector from Login to Trunk -->
    <line x1="293" y1="340" x2="340" y2="340" stroke="#000000" stroke-width="1.5"/>

    <!-- Vertical Branching Trunk -->
    <line x1="340" y1="110" x2="340" y2="570" stroke="#000000" stroke-width="1.8"/>

    <!-- Processes and Data Stores -->
    
        <!-- Process 1 -->
        <line x1="340" y1="110" x2="386" y2="110" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
        <ellipse cx="490" cy="110" rx="102" ry="36" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
