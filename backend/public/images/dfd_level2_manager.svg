    </defs>

    <!-- Top Heading -->
    <text x="470" y="38" text-anchor="middle" font-size="17" font-weight="bold" font-family="Arial, sans-serif" letter-spacing="0.5" fill="#000">DATA FLOW DIAGRAM (DFD) - LEVEL 2 MANAGER MODULE</text>
    <line x1="200" y1="48" x2="740" y2="48" stroke="#000000" stroke-width="2"/>

    <!-- Manager Table (Top Left Data Store) -->
