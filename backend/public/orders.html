<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders & Invoices - SmartBin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
        <div class="container">
            <a class="navbar-brand" href="/index.html">
                <i class="bi bi-box2-heart-fill text-warning fs-3"></i>
                <span>SmartBin</span>
                <span class="brand-badge">My Purchases</span>
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-3">
                    <li class="nav-item"><a class="nav-link" href="/index.html"><i class="bi bi-house-door me-1"></i>Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/products.html"><i class="bi bi-grid-3x3-gap me-1"></i>Browse Bins</a></li>
                    <li class="nav-item"><a class="nav-link" href="/offers.html"><i class="bi bi-tag-fill me-1 text-warning"></i>Offers</a></li>
                    <li class="nav-item"><a class="nav-link" href="/lucky-draw.html"><i class="bi bi-gift-fill me-1 text-info"></i>Lucky Draw</a></li>
                    <li class="nav-item"><a class="nav-link" href="/order-tracking.html"><i class="bi bi-truck me-1"></i>Track Order</a></li>
                </ul>

                <div class="d-flex align-items-center gap-3">
                    <a href="/wishlist.html" class="btn btn-outline-light btn-sm rounded-circle p-2 position-relative">
                        <i class="bi bi-heart fs-6"></i>
                    </a>
                    <a href="/cart.html" class="btn btn-outline-light btn-sm rounded-circle p-2 position-relative">
                        <i class="bi bi-cart3 fs-6"></i>
                        <span id="cartCountBadge" class="badge-cart">0</span>
                    </a>
                    <div id="navAuthSection"></div>
                </div>
            </div>
        </div>
    </nav>

    <main class="container my-4 my-md-5">
        <h2 class="fw-black text-dark mb-4"><i class="bi bi-box-seam text-danger me-2"></i>My Orders & Purchase Invoices</h2>

        <div id="ordersListContainer">
            <div class="text-center py-5">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="mt-2 text-muted">Loading purchase history...</p>
            </div>
        </div>
    </main>

    <!-- INVOICE POPUP MODAL -->
    <div class="modal fade" id="invoiceModal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content rounded-4 border-0 shadow-lg">
                <div class="modal-header border-0 pb-0">
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-0" id="invoiceModalBody"></div>
                <div class="modal-footer border-0 pt-0 justify-content-center">
                    <button class="btn btn-primary-custom px-4 rounded-pill fw-bold" onclick="OrdersPage.printInvoice()">
                        <i class="bi bi-printer-fill me-2"></i> Print Official Receipt / PDF
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/orders.js"></script>
</body>
</html>
