<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Wishlist - SmartBin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
        <div class="container">
            <a class="navbar-brand" href="/index.html">
                <i class="bi bi-box2-heart-fill text-warning fs-3"></i>
                <span>SmartBin</span>
                <span class="brand-badge">Wishlist</span>
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-3">
                    <li class="nav-item"><a class="nav-link" href="/index.html"><i class="bi bi-house-door me-1"></i>Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/products.html"><i class="bi bi-grid-3x3-gap me-1"></i>Browse Bins</a></li>
                    <li class="nav-item"><a class="nav-link" href="/offers.html"><i class="bi bi-tag-fill me-1 text-warning"></i>Offers</a></li>
                    <li class="nav-item"><a class="nav-link" href="/lucky-draw.html"><i class="bi bi-gift-fill me-1 text-info"></i>Lucky Draw</a></li>
                    <li class="nav-item"><a class="nav-link" href="/order-tracking.html"><i class="bi bi-truck me-1"></i>Track Order</a></li>
                </ul>

                <div class="d-flex align-items-center gap-3">
                    <a href="/wishlist.html" class="btn btn-primary-custom btn-sm rounded-circle p-2 position-relative">
                        <i class="bi bi-heart fs-6"></i>
                    </a>
                    <a href="/cart.html" class="btn btn-outline-light btn-sm rounded-circle p-2 position-relative">
                        <i class="bi bi-cart3 fs-6"></i>
                        <span id="cartCountBadge" class="badge-cart">0</span>
                    </a>
                    <div id="navAuthSection"></div>
                </div>
            </div>
        </div>
    </nav>

    <main class="container my-4 my-md-5">
        <h2 class="fw-black text-dark mb-4"><i class="bi bi-heart-fill text-danger me-2"></i>My Saved Liquidation Finds</h2>

        <div class="row g-4" id="wishlistGrid">
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="mt-2 text-muted">Loading your wishlist...</p>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        const WishlistPage = {
            async init() {
                if (!Auth.requireAuth(["User", "Manager", "Admin"])) return;
                await this.loadWishlist();
            },

            async loadWishlist() {
                const user = Auth.getUser();
                const grid = document.getElementById("wishlistGrid");
                if (!grid) return;

                try {
                    const res = await API.get(`/wishlist/${user.user_id}`);
                    const items = res.data || [];

                    if (items.length === 0) {
                        grid.innerHTML = `
                            <div class="col-12 text-center py-5">
                                <div class="card p-5 border-0 shadow-sm rounded-4 text-center">
                                    <i class="bi bi-heartbreak fs-1 text-muted mb-3"></i>
                                    <h4 class="fw-bold">Your Wishlist is Empty</h4>
                                    <p class="text-muted">Save high-value products you want to watch as daily prices drop!</p>
                                    <a href="/products.html" class="btn btn-primary-custom px-4 py-2 rounded-pill mx-auto mt-2">
                                        Explore Liquidation Bins
                                    </a>
                                </div>
                            </div>
                        `;
                        return;
                    }

                    grid.innerHTML = items.map(item => {
                        const origPrice = Number(item.original_price || item.price);
                        const currPrice = Number(item.price);
                        return `
                            <div class="col-12 col-sm-6 col-md-4 col-lg-3">
                                <div class="product-card">
                                    <div class="product-img-wrapper">
                                        <span class="bin-tag">${item.bin_number || 'Bin A'}</span>
                                        <span class="condition-badge condition-open-box">${item.condition_type}</span>
                                        <img src="${item.image}" class="product-img">
                                    </div>
                                    <div class="card-body p-3 d-flex flex-column justify-content-between flex-grow-1">
                                        <div>
                                            <small class="text-muted text-uppercase fw-bold">${item.category}</small>
                                            <h6 class="fw-bold text-dark text-truncate-2 mt-1 mb-2">${item.product_name}</h6>
                                        </div>
                                        <div class="pt-2 border-top">
                                            <div class="d-flex align-items-baseline mb-2">
                                                <span class="price-current">$${currPrice.toFixed(2)}</span>
                                                <span class="price-original">$${origPrice.toFixed(2)}</span>
                                            </div>
                                            <div class="d-grid gap-2">
                                                <button class="btn btn-primary-custom btn-sm rounded-pill" onclick="WishlistPage.moveToCart(${item.wishlist_id}, ${item.product_id})">
                                                    <i class="bi bi-cart-plus me-1"></i> Move to Cart
                                                </button>
                                                <button class="btn btn-outline-danger btn-sm rounded-pill" onclick="WishlistPage.removeWishlist(${item.wishlist_id})">
                                                    <i class="bi bi-trash me-1"></i> Remove
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `;
                    }).join("");
                } catch (e) {
                    grid.innerHTML = `<div class="col-12 text-center text-danger">Error: ${e.message}</div>`;
                }
            },

            async moveToCart(wishlistId, productId) {
                const user = Auth.getUser();
                try {
                    await API.post("/cart/add", { user_id: user.user_id, product_id: productId, quantity: 1 });
                    await API.delete(`/wishlist/delete/${wishlistId}`);
                    API.showToast("Moved to your shopping cart! 🛒", "success");
                    Auth.updateCartBadge();
                    await this.loadWishlist();
                } catch (e) {
                    API.showToast(e.message || "Failed to move item.", "error");
                }
            },

            async removeWishlist(wishlistId) {
                try {
                    await API.delete(`/wishlist/delete/${wishlistId}`);
                    API.showToast("Removed from wishlist.", "info");
                    await this.loadWishlist();
                } catch (e) {
                    API.showToast(e.message || "Failed to remove item.", "error");
                }
            }
        };

        document.addEventListener("DOMContentLoaded", () => WishlistPage.init());
    </script>
</body>
</html>
