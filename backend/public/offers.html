<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promotional Offers & Coupons - SmartBin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
        <div class="container">
            <a class="navbar-brand" href="/index.html">

                <span class="brand-badge">Offers</span>
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-3">
                    <li class="nav-item"><a class="nav-link" href="/index.html"><i class="bi bi-house-door me-1"></i>Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/products.html"><i class="bi bi-grid-3x3-gap me-1"></i>Browse Bins</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/offers.html"><i class="bi bi-tag-fill me-1 text-warning"></i>Offers</a></li>
                    <li class="nav-item"><a class="nav-link" href="/lucky-draw.html"><i class="bi bi-gift-fill me-1 text-info"></i>Lucky Draw</a></li>
                    <li class="nav-item"><a class="nav-link" href="/order-tracking.html"><i class="bi bi-truck me-1"></i>Track Order</a></li>
                </ul>

                <div class="d-flex align-items-center gap-3">
                    <a href="/wishlist.html" class="btn btn-outline-light btn-sm rounded-circle p-2 position-relative">
                        <i class="bi bi-heart fs-6"></i>
                    </a>
                    <a href="/cart.html" class="btn btn-outline-light btn-sm rounded-circle p-2 position-relative">
                        <i class="bi bi-cart3 fs-6"></i>
                        <span id="cartCountBadge" class="badge-cart">0</span>
                    </a>
                    <div id="navAuthSection"></div>
                </div>
            </div>
        </div>
    </nav>

    <main class="container my-4 my-md-5">
        <div class="text-center mb-5">
            <span class="badge bg-danger px-3 py-2 rounded-pill fw-bold text-uppercase mb-2">
                <i class="bi bi-percent me-1"></i> Liquidation Coupons
            </span>
            <h1 class="display-5 fw-black text-dark mb-2">Active Promotional Vouchers</h1>
            <p class="lead text-muted mx-auto" style="max-width: 600px;">
                Copy any coupon code below and apply it in your shopping cart for instant extra percentage savings!
            </p>
        </div>

        <div class="row g-4" id="offersListContainer">
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="mt-2 text-muted">Loading discount offers...</p>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/offers.js"></script>
