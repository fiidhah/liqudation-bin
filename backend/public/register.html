<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Register - SmartBin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
        <div class="container">
            <a class="navbar-brand" href="/index.html">
                <i class="bi bi-box2-heart-fill text-warning fs-3"></i>
                <span>SmartBin</span>
                <span class="brand-badge">Register</span>
            </a>
            <a href="/index.html" class="btn btn-outline-light btn-sm rounded-pill px-3">
                <i class="bi bi-arrow-left me-1"></i> Back to Store
            </a>
        </div>
    </nav>

    <main class="container my-5 d-flex align-items-center justify-content-center" style="min-height: 75vh;">
        <div class="card border-0 shadow-lg rounded-4 overflow-hidden w-100" style="max-width: 520px;">
            <div class="card-header bg-dark text-white text-center py-4">
                <i class="bi bi-person-plus-fill display-4 text-warning mb-2 d-block"></i>
                <h4 class="fw-bold mb-0">Create Customer Account</h4>
                <p class="text-white-50 small mb-0">Join SmartBin for exclusive daily markdown alerts & lucky draw entries</p>
            </div>

            <div class="card-body p-4 p-md-5 bg-white">
                <form id="registerForm">
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-muted text-uppercase">Full Name</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control rounded-end-3 py-2" id="regName" placeholder="e.g. Fidha Rahman" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold text-muted text-uppercase">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control rounded-end-3 py-2" id="regEmail" placeholder="fidha@example.com" required>
                        </div>
                    </div>

                    <div class="row g-2 mb-3">
                        <div class="col-md-6">
                            <label class="form-label small fw-bold text-muted text-uppercase">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-key"></i></span>
                                <input type="password" class="form-control rounded-end-3 py-2" id="regPassword" placeholder="••••••••" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-bold text-muted text-uppercase">Phone</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-telephone"></i></span>
                                <input type="tel" class="form-control rounded-end-3 py-2" id="regPhone" placeholder="+1 (555) 000-0000">
                            </div>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label small fw-bold text-muted text-uppercase">Default Delivery Address</label>
                        <textarea class="form-control rounded-3 py-2" id="regAddress" rows="2" placeholder="123 Street Name, City, State, ZIP"></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary-custom btn-lg w-100 rounded-pill fw-bold mb-3" id="regSubmitBtn">
                        Create Account
                    </button>
                </form>

                <div class="text-center small text-muted">
                    Already have an account? <a href="/login.html" class="fw-bold text-danger">Sign In here</a>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        document.getElementById("registerForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const full_name = document.getElementById("regName").value.trim();
            const email = document.getElementById("regEmail").value.trim();
            const password = document.getElementById("regPassword").value;
            const phone = document.getElementById("regPhone").value.trim();
            const address = document.getElementById("regAddress").value.trim();
            const submitBtn = document.getElementById("regSubmitBtn");

            submitBtn.disabled = true;
            submitBtn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>Creating Account...`;

            try {
                const res = await API.post("/users/register", {
                    full_name,
                    email,
                    password,
                    phone,
                    address
                });

                if (res.success) {
                    API.showToast("Account created successfully! Please sign in.", "success");
                    setTimeout(() => {
                        window.location.href = "/login.html";
                    }, 1200);
                }
            } catch (err) {
                API.showToast(err.message || "Registration failed.", "error");
                submitBtn.disabled = false;
                submitBtn.innerHTML = `Create Account`;
            }
        });
    </script>
</body>
</html>
