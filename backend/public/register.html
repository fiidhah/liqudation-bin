<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Register - SmartBin</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom Style -->
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">

    <!-- TOP ANNOUNCEMENT TICKER -->
    <div class="top-announcement-bar">
        <span>⚡ <strong>SMARTBIN LIQUIDATION:</strong> DAILY PRICE DROP SCHEDULE ACTIVE • RESTOCKED FRIDAY • CLEARANCE THURSDAY</span>
    </div>

    <!-- CLEAN EDITORIAL NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-editorial-clean sticky-top">
        <div class="container-fluid px-lg-5">
            <a class="brand-logo-text" href="/index.html">
                <div class="logo-icon-wrap">
                    <i class="bi bi-box-seam-fill"></i>
                </div>
                <span>SmartBin</span>
            </a>

            <div class="ms-auto">
                <a href="/index.html" class="btn btn-outline-dark btn-sm rounded-pill px-3 fw-bold">
                    <i class="bi bi-arrow-left me-1"></i> Back to Store
                </a>
            </div>
        </div>
    </nav>

    <main class="container my-5 d-flex align-items-center justify-content-center" style="min-height: 75vh;">
        <div class="card border-0 shadow-lg rounded-4 overflow-hidden w-100 bg-white" style="max-width: 520px;">
            <div class="card-header text-white text-center py-4" style="background: #111111;">
                <div class="d-inline-flex p-3 rounded-circle bg-white bg-opacity-10 mb-2">
                    <i class="bi bi-person-plus-fill text-warning fs-2"></i>
                </div>
                <h4 class="fw-bold mb-0 text-white">Create Customer Account</h4>
                <p class="text-white-50 small mb-0">Join SmartBin for daily markdown alerts & lucky draw entries</p>
            </div>

            <div class="card-body p-4 p-md-5">
                <form id="registerForm">
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-muted text-uppercase">Full Name</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-0"><i class="bi bi-person text-muted"></i></span>
                            <input type="text" class="form-control rounded-end-3 py-2 bg-light border-0" id="regName" placeholder="e.g. Fidha Rahman" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold text-muted text-uppercase">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-0"><i class="bi bi-envelope text-muted"></i></span>
                            <input type="email" class="form-control rounded-end-3 py-2 bg-light border-0" id="regEmail" placeholder="fidha@gmail.com" required>
                        </div>
                    </div>

                    <div class="row g-2 mb-3">
                        <div class="col-md-6">
                            <label class="form-label small fw-bold text-muted text-uppercase">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-0"><i class="bi bi-key text-muted"></i></span>
                                <input type="password" class="form-control rounded-end-3 py-2 bg-light border-0" id="regPassword" placeholder="••••••••" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-bold text-muted text-uppercase">Phone</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-0"><i class="bi bi-telephone text-muted"></i></span>
                                <input type="tel" class="form-control rounded-end-3 py-2 bg-light border-0" id="regPhone" placeholder="9876543210">
                            </div>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label small fw-bold text-muted text-uppercase">Delivery Address & City</label>
                        <textarea class="form-control rounded-3 py-2 bg-light border-0" id="regAddress" rows="2" placeholder="Malappuram, Kerala"></textarea>
                    </div>

                    <button type="submit" class="btn btn-dark btn-lg w-100 rounded-pill fw-bold mb-3 text-white shadow-sm" id="regSubmitBtn">
                        Create Account <i class="bi bi-arrow-right ms-1 text-warning"></i>
                    </button>
                </form>

                <div class="text-center small text-muted">
                    Already have an account? <a href="/login.html" class="fw-bold text-dark text-decoration-underline">Sign In here</a>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        document.getElementById("registerForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const full_name = document.getElementById("regName").value.trim();
            const email = document.getElementById("regEmail").value.trim();
            const password = document.getElementById("regPassword").value;
            const phone = document.getElementById("regPhone").value.trim();
            const address = document.getElementById("regAddress").value.trim();
            const submitBtn = document.getElementById("regSubmitBtn");

            submitBtn.disabled = true;
            submitBtn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>Creating Account...`;

            try {
                const res = await API.post("/users/register", {
                    full_name,
                    email,
                    password,
                    phone,
                    address
                });

                if (res.success) {
                    API.showSuccessModal(
                        "Account Created Successfully! 🎉",
                        "Your account has been registered in the database. You can now sign in to your SmartBin profile.",
                        "Proceed to Sign In"
                    ).then(() => {
                        window.location.href = "/login.html";
                    });
                }
            } catch (err) {
                API.showErrorModal("Registration Failed", err.message || "Failed to create account. Please check your information.");
                submitBtn.disabled = false;
                submitBtn.innerHTML = `Create Account <i class="bi bi-arrow-right ms-1 text-warning"></i>`;
            }
        });
    </script>
</body>
</html>
